[workspace]
members = [
  "crates/protocol",
  "crates/ciphernode/engine",
  "crates/state/journal",
  "crates/state/blobs",
  "crates/ciphernode/chain",
  "crates/ciphernode/p2p",
  "crates/ciphernode/jobs",
  "crates/ciphernode/node",
  "crates/testing/sim",
]
resolver = "3"

[workspace.package]
version = "0.20.0-dev.3"
edition = "2021"
license = "LGPL-3.0-only"
description = "E3 — Encrypted Execution Environments"
repository = "https://github.com/theinterfold/ciphernode"

[workspace.dependencies]
# The v2 node crates.
e3-protocol = { version = "0.20.0-dev.3", path = "./crates/protocol" }
e3-blobs = { version = "0.20.0-dev.3", path = "./crates/state/blobs" }
e3-chain = { version = "0.20.0-dev.3", path = "./crates/ciphernode/chain" }
e3-engine = { version = "0.20.0-dev.3", path = "./crates/ciphernode/engine" }
e3-jobs = { version = "0.20.0-dev.3", path = "./crates/ciphernode/jobs" }
e3-journal = { version = "0.20.0-dev.3", path = "./crates/state/journal" }
e3-p2p = { version = "0.20.0-dev.3", path = "./crates/ciphernode/p2p" }
# Shared crates, pinned to one commit of theinterfold/interfold. Bump `rev` on every line together.
e3-bfv-client = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-ciphernode-config = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-committee = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-committee-hash = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-crypto = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-entrypoint = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-data-availability = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-evm = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-evm-contracts = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-evm-transactions = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-fhe-params = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-polynomial = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-polynomial-fhe = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-trbfv = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-utils = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-zk-config = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-zk-prover = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }
e3-zk-witness = { git = "https://github.com/theinterfold/interfold", rev = "76f34ce0a2a80c26915dce9886e940d0618d808c" }

# External crates, as in theinterfold/interfold.

alloy = { version = "=1.0.41", features = ["node-bindings", "full"] }
alloy-primitives = { version = "=1.4.1", default-features = false, features = [
  "rlp",
  "serde",
  "std",
] }
alloy-sol-types = "=1.4.1"
alloy-signer = "=1.0.41"
alloy-signer-local = "=1.0.41"
anyhow = "=1.0.98"
async-trait = "=0.1.88"
bincode = "=1.3.3"
fhe = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.4.2", features = ["experimental-mbfv"] }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", tag = "v0.4.2" }
futures = "=0.3.31"
hex = "=0.4.3"
num-bigint = { version = "=0.5.1" }
ndarray = { version = "=0.17.2", features = ["serde"] }
rand_chacha = "=0.9.0"
redb = "=4.5.0"
rand = "=0.9.5"
rand_core = "=0.9.5"
rayon = "=1.10.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.20.0"
thiserror =  { version = "=1.0.69" }
tokio = { version = "=1.46.1", features = ["full"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "time"] }
zeroize = "=1.9.0"
libp2p = { version = "=0.56.0", features = [
  "gossipsub",
  "identify",
  "dns",
  "ed25519",
  "kad",
  "macros",
  "mdns",
  "ping",
  "quic",
  "tokio",
  "request-response",
  "cbor"
]}

# Debug tests recover and sign many operator signatures (the v2 simulator runs whole committees);
# optimized curve and hash crates make them about six times faster.
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.tiny-keccak]
opt-level = 3
